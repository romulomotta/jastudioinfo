# Valida o conteudo.json e, se estiver certo, publica o repositório no GitHub Pages.
# Com o JSON errado, a publicação para e o app continua recebendo a versão anterior.
name: Publicar conteúdo

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publicar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      # Sempre o main atual: um re-run de execução antiga não republica conteúdo velho
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Validar conteudo.json
        run: python3 scripts/validar.py
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deploy
        uses: actions/deploy-pages@v4
