# Reduz as fotos, valida o conteudo.json e, se estiver certo, publica o repositório no GitHub Pages.
# Com o JSON errado, a publicação para e o app continua recebendo a versão anterior.
name: Publicar conteúdo

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write  # para salvar as fotos reduzidas no repositório
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publicar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      # Sempre o main atual: um re-run de execução antiga não republica conteúdo velho
      - uses: actions/checkout@v4
        with:
          ref: main
      # Fotos com mais de 600 px ou 200 KB, ou em PNG/WebP, viram JPG leve. O commit feito com o
      # GITHUB_TOKEN não dispara outra execução; esta mesma segue e publica as fotos reduzidas
      - name: Reduzir fotos
        run: |
          pip install --quiet pillow==11.3.0
          python3 scripts/otimizar_fotos.py
      - name: Salvar fotos reduzidas
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -A fotos conteudo.json
            git commit -m "reduz as fotos (automatico)"
            git push
          fi
      - name: Validar conteudo.json
        run: python3 scripts/validar.py
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deploy
        uses: actions/deploy-pages@v4
